services:
  bot:
    build: .
    container_name: rexco-tg-seller
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    container_name: rexco-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Intentionally not published to the public host interface.
volumes:
  mongo_data:
